<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공지사항 요약</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f8f9fa;
            --unread-color: #ff4d4f;
            --ongoing-color: #52c41a;
        }

        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center; /* 화면 전체 중앙 정렬 */
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
        }

        .header span {
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
        }

        .card-container {
            width: 100%;
            max-width: 400px; /* 모바일 적정 너비 */
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .summary-card {
            background: white;
            border-radius: 20px;
            padding: 30px 20px;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 8px 15px rgba(0,0,0,0.05);
            
            /* 내부 콘텐츠 중앙 정렬 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .summary-card:active {
            transform: scale(0.96);
            background-color: #f0f0f0;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 500;
            color: #888;
            margin-bottom: 10px;
        }

        .card-count {
            font-size: 2.5rem;
            font-weight: 800;
            line-height: 1;
        }

        .card-count small {
            font-size: 1.2rem;
            font-weight: 600;
            margin-left: 4px;
        }

        /* 상태별 색상 */
        .unread .card-count { color: var(--unread-color); }
        .ongoing .card-count { color: var(--ongoing-color); }

    </style>
</head>
<body>

    <div class="header">
        <h1><span>홍길동</span> 님. 안녕하세요!</h1>
    </div>

    <div class="card-container">
        <a href="recv_noti_list.html?type=unread" class="summary-card unread">
            <div class="card-title">미확인</div>
            <div class="card-count">00<small>건</small></div>
        </a>

        <a href="recv_noti_list.html?type=ongoing" class="summary-card ongoing">
            <div class="card-title">참여중</div>
            <div class="card-count">00<small>건</small></div>
        </a>
    </div>

</body>
</html>
